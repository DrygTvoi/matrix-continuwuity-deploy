[Definition]
# Caddy access logs are JSON (see config/Caddyfile). Match failed logins on
# the homeserver and Element Web: 401 Unauthorized / 403 Forbidden.
# client_ip is logged because Caddy configures trusted_proxies; it is the real
# client address both with the bundled Caddy and behind an external proxy.
failregex = ^.*"status":401.*"client_ip":"<HOST>".*$
            ^.*"client_ip":"<HOST>".*"status":401.*$
            ^.*"status":403.*"client_ip":"<HOST>".*$
            ^.*"client_ip":"<HOST>".*"status":403.*$

ignoreregex =
